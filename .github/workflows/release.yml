name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Offline regression suite
        run: swift run ssms-tests

      - name: Editor rendering check
        run: swift run ssms-mac --editor-check

      - name: Assemble the app bundle
        run: ./Scripts/build-app.sh release

      # Everything below is skipped when the Developer ID secrets are absent, so a
      # fork or an unfunded repo still gets a working (unsigned) disk image.
      # `secrets` cannot be referenced from a step `if:`, so resolve the flag once
      # into a step output that later conditions can read.
      - name: Detect the signing configuration
        id: signing
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ] && [ -n "${{ secrets.MACOS_DEVELOPER_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "This build will be signed with a Developer ID."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID configured; publishing an unsigned build."
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f $RUNNER_TEMP/certificate.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign, notarize and package
        env:
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./Scripts/sign-and-notarize.sh

      - name: Checksums
        run: |
          cd build
          shasum -a 256 SSMS-for-Mac-*.dmg | tee SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            INSTALL_NOTE="This build is signed and notarized, so it opens normally."
          else
            INSTALL_NOTE=$'This build is **not notarized**. macOS shows a Gatekeeper prompt on downloaded copies; open it once with **right-click \u2192 Open**, or build from source instead. See \`docs/CODE_SIGNING.md\`.'
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          **Build from source (no Gatekeeper prompt, ever):**

          \`\`\`bash
          git clone https://github.com/Bornanaj/SSMS_MAC.git
          cd SSMS_MAC && ./Scripts/install.sh
          \`\`\`

          **Or download the disk image below** and drag the app to Applications.

          $INSTALL_NOTE
          NOTES
          gh release create "$TAG" \
            build/SSMS-for-Mac-*.dmg build/SHA256SUMS.txt \
            --title "SSMS for Mac $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
